version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: myapp-postgres
    restart: always
    ports:
      - "5434:5432"      # host:container
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
